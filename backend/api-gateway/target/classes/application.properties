server.port=8080
spring.application.name=api-gateway
spring.cloud.compatibility-verifier.enabled=false

jwt.secret=${JWT_SECRET:ecommerce-demo-jwt-secret-key-change-me-min-32-chars}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=address-routes
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/shop/address/**

spring.cloud.gateway.server.webflux.routes[2].id=admin-users
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/admin/users/**

spring.cloud.gateway.server.webflux.routes[3].id=shop-products
spring.cloud.gateway.server.webflux.routes[3].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/shop/products/**

spring.cloud.gateway.server.webflux.routes[4].id=admin-products
spring.cloud.gateway.server.webflux.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/admin/products/**

spring.cloud.gateway.server.webflux.routes[5].id=shop-search
spring.cloud.gateway.server.webflux.routes[5].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/shop/search/**

spring.cloud.gateway.server.webflux.routes[6].id=shop-review
spring.cloud.gateway.server.webflux.routes[6].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/shop/review/**

spring.cloud.gateway.server.webflux.routes[7].id=common-feature
spring.cloud.gateway.server.webflux.routes[7].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/common/feature/**

spring.cloud.gateway.server.webflux.routes[8].id=shop-cart
spring.cloud.gateway.server.webflux.routes[8].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/shop/cart/**

spring.cloud.gateway.server.webflux.routes[9].id=shop-order
spring.cloud.gateway.server.webflux.routes[9].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/shop/order/**

spring.cloud.gateway.server.webflux.routes[10].id=admin-orders
spring.cloud.gateway.server.webflux.routes[10].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/admin/orders/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.org.springframework.cloud.gateway=INFO
