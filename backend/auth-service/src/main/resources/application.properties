server.port=8081
spring.application.name=auth-service
spring.cloud.compatibility-verifier.enabled=false

# auth-service owns the users and addresses collections
spring.data.mongodb.uri=mongodb://localhost:27017/authdb

# Same secret in every service so a token issued here is accepted everywhere
jwt.secret=${JWT_SECRET:ecommerce-demo-jwt-secret-key-change-me-min-32-chars}
# Token lifetime in milliseconds (1 hour)
jwt.expiration=3600000

# The React frontend sends the JWT as this httpOnly cookie
app.cookie.name=token
app.cookie.secure=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persistAuthorization=true

logging.level.com.ecommerce=INFO

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
